# ===================================================================
# 云原生构建配置文件
# ===================================================================

# -----------------------------------------------------------------------------
# Docker 镜像（任意分支，推送时改动涉及 .ide/Dockerfile 才构建并推送）
# -----------------------------------------------------------------------------
"**":
  push:
    - git:
        enable: true
        submodules:
          enable: false
      ifModify:
        - .ide/Dockerfile
      imports:
        - https://cnb.cool/OrionSeeker/SecretsHub/-/blob/main/docker.yml
      services:
        - docker
      stages:
        - name: docker build and push
          script: |
            echo "检测到 .ide/Dockerfile 改动，触发镜像构建并推送"
            docker login -u cnb -p "${DOCKER_TOKEN}" docker.cnb.cool
            docker build -f .ide/Dockerfile -t docker.cnb.cool/orionseeker/stelquis:latest .
            docker push docker.cnb.cool/orionseeker/stelquis:latest

# -----------------------------------------------------------------------------
# 云原生开发环境配置
# -----------------------------------------------------------------------------
$:
  vscode:
    - name: Stelquis
      git:
        enable: true
        submodules:
          enable: false
      docker:
        image: docker.cnb.cool/orionseeker/stelquis:latest
      services:
        - vscode
        - docker
      stages:
        - name: workspace init
          script: |
            echo "🚀 云原生开发环境已就绪"