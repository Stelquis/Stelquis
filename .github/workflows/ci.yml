name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: 语法校验
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: python3 -m pip install --quiet pyyaml

      - name: YAML / JSON 语法
        run: python3 scripts/check-syntax.py

      - name: Shell 语法
        run: bash -n scripts/*.sh

      - name: Python 语法
        run: python3 -m compileall -q -x '(\.git|repos)/' .
